<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1>Snake</h1>
      <div class="scores">
        <p class="score">Score : <span id="score" aria-live="polite">0</span></p>
        <p class="score best">Record : <span id="best">0</span></p>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="400" height="400" tabindex="0"
              aria-label="Plateau de jeu Snake"></canvas>
      <div id="overlay" class="overlay" hidden>
        <div class="overlay-box" role="dialog" aria-labelledby="overlay-title">
          <h2 id="overlay-title">Partie terminée</h2>
          <button id="restart" type="button">Recommencer</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="pause" type="button" disabled aria-describedby="pause-hint">Pause</button>
      <span id="pause-hint" class="hint">Disponible une fois la partie commencée.</span>
    </div>

    <div class="dpad" role="group" aria-label="Commandes de direction">
      <button id="dir-up" class="dir dir-up" type="button" aria-label="Haut"><span aria-hidden="true">▲</span></button>
      <button id="dir-left" class="dir dir-left" type="button" aria-label="Gauche"><span aria-hidden="true">◀</span></button>
      <button id="dir-right" class="dir dir-right" type="button" aria-label="Droite"><span aria-hidden="true">▶</span></button>
      <button id="dir-down" class="dir dir-down" type="button" aria-label="Bas"><span aria-hidden="true">▼</span></button>
    </div>

    <p id="message" class="message" aria-live="polite"></p>

    <p class="help">
      Déplacements : flèches, ZQSD, WASD ou croix tactile · Pause : Espace ou bouton Pause · Recommencer : Entrée
    </p>
  </main>

  <script src="snake.js"></script>
  <script src="best-score.js"></script>
  <script src="game.js"></script>
</body>
</html>
